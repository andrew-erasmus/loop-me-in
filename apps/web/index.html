<!doctype html>
<html lang="en" class="splashing">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content` makes the on-screen keyboard
         actually shrink the viewport instead of just floating over the
         bottom of it — without it, `100dvh` sheets and `position: fixed`
         elements (the bottom tab bar, a form sheet's Save button) don't know
         the keyboard is there and end up either hidden behind it or stuck
         wherever the layout viewport happened to be before it opened. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- PWA install + iOS home-screen chrome. vite-plugin-pwa injects the
         manifest link and service-worker registration at build time. -->
    <meta name="theme-color" content="#33502e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loop Me In" />

    <!-- Bricolage Grotesque for headings, Inter for everything else.
         preconnect because the CSS and the font files come from two different
         hosts — without it the browser discovers fonts.gstatic.com only after
         the stylesheet has parsed, costing a round trip on first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <!-- The launch splash's styles live here, not in styles.css, because the
         splash has to paint before the bundle (and its stylesheet) has even
         been fetched — that is the whole point of it. `lib/splash.ts` takes it
         down once the app knows who is signed in.

         #25391f is `--color-primary-pressed`, repeated rather than referenced
         for the same reason. It is the darker of the two greens on purpose:
         `--color-primary` matches the buttons by hex, but a whole screen of it
         reads noticeably lighter than a small button on white does. -->
    <style>
      /* Green behind everything while the splash is up, so no white edge
         shows past it on iOS. `splash.ts` drops the class, handing the canvas
         back to the white that styles.css gives it. */
      html.splashing,
      html.splashing body {
        background-color: #25391f;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: #25391f;
        transition: opacity 400ms ease;
      }
      #splash.leaving {
        opacity: 0;
      }
      /* Freeze the symbol while it fades, rather than letting it start
         unwinding on its way out. */
      #splash.leaving path {
        animation-play-state: paused;
      }

      #splash svg {
        width: 168px;
        height: auto;
        overflow: visible;
      }

      /* Two strands, each half of the symbol: one runs from the left tip over
         the top and through the crossing to the right tip, the other mirrors
         it from the right. They draw at once, pass through each other in the
         middle, and each finishes exactly where the other set out — so the
         loop closes. Then they let go from their tails and go round again.

         pathLength="1" makes the dash maths length-independent. The gap is a
         little longer than the dash, and the offsets overshoot ±1, so the
         round caps sit well inside the gap when a strand is hidden instead of
         leaving a dot at either end. */
      #splash path {
        fill: none;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-dasharray: 1 1.2;
        stroke-dashoffset: 1.1;
        animation: splash-loop 2800ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #splash .strand-a {
        stroke: #ffffff;
      }
      #splash .strand-b {
        stroke: #c2cdbc; /* moss-300: the second person's strand */
      }

      /* Keep these percentages in step with HOLD_START / HOLD_END in
         lib/splash.ts — that's where it waits for the symbol to be whole
         before taking the splash down. */
      @keyframes splash-loop {
        0% {
          stroke-dashoffset: 1.1;
        }
        45%,
        62% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1.1;
        }
      }

      #splash .splash-name {
        margin: 0;
        color: #ffffff;
        font-family: 'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: splash-name-in 700ms ease 500ms forwards;
      }
      @keyframes splash-name-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash path {
          animation: none;
          stroke-dashoffset: 0;
        }
        #splash .splash-name {
          animation: none;
          opacity: 1;
        }
      }
    </style>

    <title>Loop Me In</title>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Loop Me In">
      <svg viewBox="0 0 200 100" aria-hidden="true">
        <path class="strand-a" pathLength="1" d="M20 50C20 4 82 6 100 50S180 96 180 50" />
        <path class="strand-b" pathLength="1" d="M180 50C180 4 118 6 100 50S20 96 20 50" />
      </svg>
      <p class="splash-name">Loop Me In</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
